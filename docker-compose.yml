services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  userservice:
    build: ./microservices/Userservices
    restart: unless-stopped
    env_file:
      - ./microservices/Userservices/.env
    environment:
      PORT: 5000
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:-rootpassword}@mysql:3306/eduverse_users
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy

  courseservice:
    build: ./microservices/courseService
    restart: unless-stopped
    env_file:
      - ./microservices/courseService/.env
    environment:
      PORT: 5001
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:-rootpassword}@mysql:3306/eduverse_courses
    ports:
      - "5001:5001"
    depends_on:
      mysql:
        condition: service_healthy

  purchaseservice:
    build: ./microservices/purchaseService
    restart: unless-stopped
    env_file:
      - ./microservices/purchaseService/.env
    environment:
      PORT: 5002
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:-rootpassword}@mysql:3306/eduverse_purchases
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?Set FRONTEND_ORIGIN in frontend/.env.local}
    ports:
      - "5002:5002"
    depends_on:
      mysql:
        condition: service_healthy

  aiservice:
    build: ./microservices/AIService
    restart: unless-stopped
    env_file:
      - ./microservices/AIService/.env
    environment:
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?Set FRONTEND_ORIGIN in frontend/.env.local}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL in frontend/.env.local}
        NEXT_PUBLIC_USER_API_URL: ${NEXT_PUBLIC_USER_API_URL:?Set NEXT_PUBLIC_USER_API_URL in frontend/.env.local}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?Set NEXT_PUBLIC_API_BASE_URL in frontend/.env.local}
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:?Set NEXT_PUBLIC_BASE_URL in frontend/.env.local}
        NEXT_PUBLIC_PURCHASE_API_URL: ${NEXT_PUBLIC_PURCHASE_API_URL:?Set NEXT_PUBLIC_PURCHASE_API_URL in frontend/.env.local}
        NEXT_PUBLIC_AI_API_URL: ${NEXT_PUBLIC_AI_API_URL:?Set NEXT_PUBLIC_AI_API_URL in frontend/.env.local}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID}
        NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID}
    restart: unless-stopped
    env_file:
      - ./frontend/.env.local
    environment:
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - userservice
      - courseservice
      - purchaseservice
      - aiservice

volumes:
  mysql_data: