services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  userservice:
    build: ./microservices/Userservices
    restart: unless-stopped
    env_file:
      - ./microservices/Userservices/.env
    environment:
      PORT: 5000
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:-rootpassword}@mysql:3306/eduverse_users
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy

  courseservice:
    build: ./microservices/courseService
    restart: unless-stopped
    env_file:
      - ./microservices/courseService/.env
    environment:
      PORT: 5001
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:-rootpassword}@mysql:3306/eduverse_courses
    ports:
      - "5001:5001"
    depends_on:
      mysql:
        condition: service_healthy

  purchaseservice:
    build: ./microservices/purchaseService
    restart: unless-stopped
    env_file:
      - ./microservices/purchaseService/.env
    environment:
      PORT: 5002
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:-rootpassword}@mysql:3306/eduverse_purchases
    ports:
      - "5002:5002"
    depends_on:
      mysql:
        condition: service_healthy

  aiservice:
    build: ./microservices/AIService
    restart: unless-stopped
    env_file:
      - ./microservices/AIService/.env
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env.local
    environment:
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - userservice
      - courseservice
      - purchaseservice
      - aiservice

volumes:
  mysql_data: